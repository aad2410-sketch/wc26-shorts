name: Daily WC26 Shorts

on:
  schedule:
    - cron: "30 1 * * *"    # ~07:00 IST + GitHub drift -> morning recap run
    - cron: "30 12 * * *"   # ~18:00 IST + GitHub drift -> evening preview run
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which run to execute"
        type: choice
        options: [auto, recap, preview]
        default: auto
      dry_run:
        description: "Render only - skip publishing"
        type: boolean
        default: false

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run type
        id: runtype
        env:
          INPUT_RUN_TYPE: ${{ inputs.run_type }}
        run: |
          if [ -n "$INPUT_RUN_TYPE" ] && [ "$INPUT_RUN_TYPE" != "auto" ]; then
            echo "run_type=$INPUT_RUN_TYPE" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -lt 6 ]; then
            echo "run_type=recap" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Render videos
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m src.main render \
            --run-type "${{ steps.runtype.outputs.run_type }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Push rendered videos (Instagram fetches them from the raw URL)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state.json
          git diff --cached --quiet || git commit -m "render: $(date -u +%F) ${{ steps.runtype.outputs.run_type }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Publish to YouTube + Instagram
        if: ${{ inputs.dry_run != true }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.main publish

      - name: Push state + prune published videos (daily keepalive)
        if: ${{ always() }}
        run: |
          git add -A output state.json
          git diff --cached --quiet || git commit -m "publish: $(date -u +%F) results [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
